# Example secrets file. Copy to inventory/secrets.yaml (git-ignored) and fill
# in real values, then pass it with --secrets:
#
#   yaml-frag render gb10-01 --secrets inventory/secrets.yaml
#
# A flat name -> value store. `from: secret` variable sources look names up
# here. Values must never be logged. See README.md "Secrets".
secrets:
  gb10-01_password: "change-me-plaintext-password"
  gb10-02_password: "change-me-plaintext-password"
  generic-vm-01_password: "change-me-plaintext-password"
