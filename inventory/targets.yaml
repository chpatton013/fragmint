# Inventory: defaults, reusable groups, and targets.
# See PLAN.md "Inventory format".
#
# This is the example autoinstall project. A "target" is any named thing you
# render a document for; here they happen to be machines. Fragment paths are
# arbitrary — the tool imposes no category structure. Precedence is positional:
# the resolved fragment list (defaults -> groups -> target) is applied in order.
version: 1

defaults:
  variables:
    identity_username: chris
    ssh_import_id: gh:chpatton013
    locale: en_US.UTF-8
    keyboard_layout: us

  fragments:
    - autoinstall/base
    - autoinstall/default-user
    - ubuntu-24.04

groups:
  gb10:
    variables:
      hardware_model: gb10
    fragments:
      - hardware/gb10

  generic_vm:
    variables:
      hardware_model: generic-vm
    fragments:
      - hardware/generic-vm

  general_servers:
    fragments:
      - roles/general-server

  proxmox_hosts:
    fragments:
      - roles/proxmox-host

  docker_hosts:
    fragments:
      - roles/docker-host

targets:
  # Each target ends its fragment list with autoinstall/checks so the
  # structural assertions run against the fully composed document. This is how
  # document-specific validation is expressed now — via fragments, not built
  # into the renderer.
  gb10-01:
    groups:
      - gb10
      - general_servers
    fragments:
      - hosts/gb10-01
      - autoinstall/checks
    variables:
      identity_hostname: gb10-01
      identity_password_hash: "$6$example-salt$example-hash"
      primary_interface: enP7s7

  gb10-02:
    groups:
      - gb10
      - general_servers
    fragments:
      - hosts/gb10-02
      - autoinstall/checks
    variables:
      identity_hostname: gb10-02
      identity_password_hash: "$6$example-salt$example-hash"
      primary_interface: enP7s7

  generic-vm-01:
    groups:
      - generic_vm
      - general_servers
    fragments:
      - hosts/generic-vm-01
      - autoinstall/checks
    variables:
      identity_hostname: generic-vm-01
      identity_password_hash: "$6$example-salt$example-hash"
      primary_interface: enp1s0
