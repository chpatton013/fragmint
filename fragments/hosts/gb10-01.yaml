fragment:
  version: 1
  name: hosts/gb10-01
  description: Host-specific configuration for gb10-01.

# Host-specific values (hostname, password hash, interface) are supplied as
# inventory variables. This fragment carries only per-host overrides. It
# currently just asserts the expected hardware storage layout is in place
# before host tweaks; add host-specific operations here as needed.
operations:
  - op: assert
    path: /autoinstall/storage/layout/name
    equals: lvm
