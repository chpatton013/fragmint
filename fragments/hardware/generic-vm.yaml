fragment:
  version: 1
  name: hardware/generic-vm
  description: Configuration for a generic virtual machine guest.

requires:
  variables:
    - primary_interface

operations:
  - op: set
    path: /autoinstall/kernel
    value:
      package: linux-generic

  - op: set
    path: /autoinstall/storage
    value:
      layout:
        name: lvm
        sizing-policy: all

  - op: set
    path: /autoinstall/network
    value:
      version: 2
      ethernets:
        primary:
          match:
            name: "{{ primary_interface }}"
          dhcp4: true
          dhcp6: false

  - op: assert
    path: /autoinstall/network/version
    equals: 2

  - op: append
    path: /autoinstall/user-data/packages
    deduplicate: true
    value:
      - qemu-guest-agent
