# Continuous integration: the same three checks README.md "Development"
# documents, run against the locked dependency set from uv.lock.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels an in-flight run for that same branch; runs on
# main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        # pyproject requires-python is >=3.12.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Sets UV_PYTHON for every later step, so `uv run` uses the same
          # interpreter `uv sync` built the environment with.
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # --locked fails rather than silently re-resolving, so CI cannot drift
        # from the committed uv.lock. If this step fails, run `uv lock` locally
        # and commit the result.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest
