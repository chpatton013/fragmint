# A reusable module that composes a single Ansible inventory document across
# every target that contributes to it. See README.md "The module model" and
# "Aggregate outputs".
version: 1

outputs:
  ansible-inventory:
    # One file for the whole run, not one per target.
    scope: aggregate
    path: "rendered/inventory.yaml"
    # Whole-document validation for the composed inventory — aggregate scope
    # can't rely on a trailing assertion fragment (see README.md "Aggregate
    # outputs").
    schema: ansible-inventory.schema.json

defaults:
  outputs:
    # Every importer's targets opt into this output at once.
    ansible-inventory:
      fragments:
        - ansible/host

aggregate:
  outputs:
    ansible-inventory:
      # Runs once, after every contributing target, so its assertions see the
      # finished document (README.md "Aggregate outputs") — the schema above
      # checks shape; this checks a fact the schema cannot state.
      epilogue:
        - ansible/checks

groups:
  gb10:
    variables:
      ansible_group: gb10
  generic_vm:
    variables:
      ansible_group: generic_vm
