# A reusable module that composes a single Ansible inventory document across
# every target that contributes to it. See README.md "The module model" and
# "Aggregate outputs".
version: 1

outputs:
  ansible-inventory:
    # One file for the whole run, not one per target.
    scope: aggregate
    path: "rendered/inventory.yaml"
    # Whole-document validation for the composed inventory — aggregate scope
    # can't rely on a trailing assertion fragment (see README.md "Aggregate
    # outputs").
    schema: ansible-inventory.schema.json
  ansible-inventory-json:
    # The same composed inventory, serialized as JSON instead of YAML — for
    # feeding a CMDB import, a dynamic-inventory consumer, or any tool that
    # expects `ansible-inventory --list`-style JSON rather than a YAML file
    # meant for human review. Format is independent of scope, fragments, and
    # schema: this output shares all three with `ansible-inventory` and
    # differs only in `path`'s extension (README.md "Outputs and validators
    # across the closure").
    scope: aggregate
    path: "rendered/inventory.json"
    schema: ansible-inventory.schema.json

defaults:
  outputs:
    # Every importer's targets opt into both outputs at once.
    ansible-inventory:
      fragments:
        - ansible/host
    ansible-inventory-json:
      fragments:
        - ansible/host

aggregate:
  outputs:
    ansible-inventory:
      # Runs once, after every contributing target, so its assertions see the
      # finished document (README.md "Aggregate outputs") — the schema above
      # checks shape; this checks a fact the schema cannot state. Written in
      # TOML (see ansible/checks.toml) to demonstrate that a fragment's own
      # format is independent of any output's (README.md "Supported
      # formats").
      epilogue:
        - ansible/checks
    ansible-inventory-json:
      epilogue:
        - ansible/checks

groups:
  gb10:
    variables:
      ansible_group: gb10
  generic_vm:
    variables:
      ansible_group: generic_vm
