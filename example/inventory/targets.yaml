# Inventory: defaults, reusable groups, and targets.
# See README.md "Authoring inventory".
#
# This is the example autoinstall project. A "target" is any named thing you
# render a document for; here they happen to be machines. Fragment paths are
# arbitrary — the tool imposes no category structure. Each layer declares its
# fragment contribution per OUTPUT (this project has `user-data` and
# `meta-data`, per yaml-frag.yaml). Precedence is positional within each
# output: the resolved fragment list (defaults -> groups -> target) is applied
# in order. Variables are NOT per-output — they're shared across every output
# a target produces.
version: 1

defaults:
  variables:
    identity_username: chris
    ssh_import_id: gh:chpatton013
    locale: en_US.UTF-8
    keyboard_layout: us

  outputs:
    user-data:
      fragments:
        - autoinstall/base
        - autoinstall/default-user
        - ubuntu-24.04
    # Shared by every target: cloud-init instance-id/local-hostname only need
    # identity_hostname, which every target defines.
    meta-data:
      fragments:
        - meta/instance-id

groups:
  gb10:
    variables:
      hardware_model: gb10
    outputs:
      user-data:
        fragments:
          - hardware/gb10

  generic_vm:
    variables:
      hardware_model: generic-vm
    outputs:
      user-data:
        fragments:
          - hardware/generic-vm

  general_servers:
    outputs:
      user-data:
        fragments:
          - roles/general-server

  proxmox_hosts:
    outputs:
      user-data:
        fragments:
          - roles/proxmox-host

  docker_hosts:
    outputs:
      user-data:
        fragments:
          - roles/docker-host

targets:
  # Each target ends its user-data fragment list with autoinstall/checks so
  # the structural assertions run against the fully composed document. This is
  # how document-specific validation is expressed now — via fragments, not
  # built into the renderer.
  gb10-01:
    groups:
      - gb10
      - general_servers
    outputs:
      user-data:
        fragments:
          - hosts/gb10-01
          - autoinstall/checks
    variables:
      identity_hostname: gb10-01
      # Computed at render time: feed the plaintext password secret to
      # `openssl passwd -6` on stdin and capture the resulting hash.
      # See README.md "Variable value sources". Requires --secrets.
      identity_password_hash:
        from: capture
        command: [openssl, passwd, -6, -stdin]
        stdin: { from: secret, name: gb10-01_password }
      primary_interface: enP7s7

  gb10-02:
    groups:
      - gb10
      - general_servers
    outputs:
      user-data:
        fragments:
          - hosts/gb10-02
          - autoinstall/checks
    variables:
      identity_hostname: gb10-02
      identity_password_hash:
        from: capture
        command: [openssl, passwd, -6, -stdin]
        stdin: { from: secret, name: gb10-02_password }
      primary_interface: enP7s7

  generic-vm-01:
    groups:
      - generic_vm
      - general_servers
    outputs:
      user-data:
        fragments:
          - hosts/generic-vm-01
          - autoinstall/checks
    variables:
      identity_hostname: generic-vm-01
      identity_password_hash:
        from: capture
        command: [openssl, passwd, -6, -stdin]
        stdin: { from: secret, name: generic-vm-01_password }
      primary_interface: enp1s0
