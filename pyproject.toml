[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-frag"
version = "0.1.0"
description = "Generic YAML fragment composer: render structured YAML documents from an inventory, ordered reusable fragments, per-target variables, and explicit path-based merge operations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Christopher Patton" }]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.21",
    "pydantic>=2.6",
]

# Development tooling, as a PEP 735 dependency group rather than an extra:
# `uv sync`/`uv run` install the `dev` group automatically, so `uv run pytest`
# works straight after a clone. Consumers installing the package never see it.
# See README.md "Development".
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.9",
    "ruff>=0.4",
    # mypy runs in strict mode and jsonschema ships no inline types.
    "types-jsonschema>=4.21",
]

[project.scripts]
yaml-frag = "yaml_frag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yaml_frag = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
