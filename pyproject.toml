[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoinstall-renderer"
version = "0.1.0"
description = "Render Ubuntu Server autoinstall configurations from an inventory and ordered, explicit configuration fragments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Christopher Patton" }]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.21",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
autoinstall-render = "autoinstall_renderer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoinstall_renderer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
